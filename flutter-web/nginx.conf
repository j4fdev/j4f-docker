server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Compresión gzip para archivos estáticos de Flutter Web
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/x-javascript
        application/json
        application/wasm
        image/svg+xml;

    # Regla 1: index.html, flutter_service_worker.js y config.json NUNCA deben quedar en caché persistente
    location ~* (index\.html|flutter_service_worker\.js|assets/config\.json)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Regla 2: Archivos estáticos inmutables (WASM, JS hasheados, fuentes, imágenes)
    location ~* \.(?:ico|css|js|gif|jpe?g|png|wasm|woff2?|ttf|svg|otf)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Regla 3: SPA fallback para rutas cliente de Flutter
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Regla 4: Health check
    location = /healthz {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }
}
